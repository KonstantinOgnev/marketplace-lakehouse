trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-24.04

variables:
  pythonVersion: "3.11"
  bundleTarget: dev

stages:
  - stage: Quality
    displayName: Static checks and unit tests
    jobs:
      - job: quality
        steps:
          - checkout: self
            fetchDepth: 1
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
          - bash: |
              python -m pip install --upgrade pip
              pip install -r requirements-dev.txt
              pip install -e .
            displayName: Install test dependencies
          - bash: ruff check src tests scripts
            displayName: Ruff lint
          - bash: python scripts/validate_repo.py
            displayName: Validate repository and secret hygiene
          - bash: pytest -q --junitxml=$(Common.TestResultsDirectory)/pytest.xml
            displayName: Run unit and structural tests
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(Common.TestResultsDirectory)/pytest.xml
              failTaskOnFailedTests: true

  - stage: BundleValidate
    displayName: Validate Databricks bundle
    dependsOn: Quality
    jobs:
      - job: validate_bundle
        steps:
          - checkout: self
          - bash: |
              curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
              databricks version
              databricks bundle validate -t $(bundleTarget) --var="job_service_principal=$(DATABRICKS_CLIENT_ID)"
            displayName: Install CLI and validate bundle
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
              DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)

  - stage: DeployDev
    displayName: Deploy and smoke test dev
    dependsOn: BundleValidate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: deploy_dev
        environment: marketplace-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - bash: |
                    curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
                    databricks bundle deploy -t dev --var="job_service_principal=$(DATABRICKS_CLIENT_ID)"
                    databricks bundle run marketplace_smoke_test -t dev --var="job_service_principal=$(DATABRICKS_CLIENT_ID)"
                  displayName: Deploy bundle and run smoke test
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
                    DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)
